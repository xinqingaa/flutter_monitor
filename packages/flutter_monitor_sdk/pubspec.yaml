name: flutter_monitor_sdk
description: "A Flutter runtime monitoring SDK for errors, performance, behavior, jank, memory, and trace observability."
version: 1.0.0
homepage: https://github.com/xinqingaa/flutter_monitor
repository: https://github.com/xinqingaa/flutter_monitor

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=1.17.0"
resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_monitor_core: ^0.1.0
  http: ^1.2.1
  dio: ^5.4.3+1
  device_info_plus: ^11.2.0
  package_info_plus: ^8.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
 
