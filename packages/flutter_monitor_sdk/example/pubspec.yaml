name: example
description: PulseFit demo app for Flutter Monitor SDK.
publish_to: 'none'

environment:
  sdk: '>=3.10.0 <4.0.0'
resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  logger: ^2.6.1
  dio: ^5.4.3+1
  device_info_plus: ^11.2.0
  package_info_plus: ^8.2.0
  flutter_monitor_sdk:
    path: ..
  flutter_monitor_native:
    path: ../../flutter_monitor_native

  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
